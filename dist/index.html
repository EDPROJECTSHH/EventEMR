<meta name="description" content="Mini Emergency &amp; Critical Care Event EMR. Offline-first mini-EMR for hospital medical standby at mass-gathering events.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mini Emergency &amp; Critical Care Event EMR</title>
<link rel="manifest" href="manifest.webmanifest">

<style>/* ==========================================================================
   Mini Emergency & Critical Care Event EMR

   Built as an operations board, not a document: the home screen is scanned
   from across a tent, so state is carried in form (severity stripe, chip,
   pulse) as well as in number. Colour is spent on acuity and on nothing else
   decorative — the Siloam navy is structure, the amber is the single accent.

   Palette   brand #1C2E7A navy · accent #F5B335 amber · neutrals biased cool
             toward the navy so nothing reads as default grey. Light only, by
             request: a medical tent is lit by daylight or a floodlight, and a
             dark UI on a glossy tablet in either is unreadable.
   Type      Plus Jakarta Sans for everything that is read, at heavy weights —
             it is a modern geometric sans drawn for Jakarta's own identity, so
             it belongs on a Jakarta event. IBM Plex Mono carries every number,
             because a column of vitals has to line up.
   ========================================================================== */

/* ---- tokens: the complete light palette lives here ---------------------- */
:root {
  --ground:     #eef1f6;
  --surface:    #ffffff;
  --surface-2:  #e7ebf3;
  --sunk:       #dde3ed;
  --line:       #d1d9e6;
  --line-soft:  #e3e8f1;

  --ink:    #0f1623;
  --ink-2:  #36425a;
  --ink-3:  #65728c;
  --ink-4:  #93a0b8;

  --brand:      #1c2e7a;
  --brand-ink:  #16245f;
  --brand-wash: #e4e9f7;
  --brand-line: #b9c5e8;

  --accent:      #f5b335;
  --accent-ink:  #8a5c00;
  --accent-wash: #fdf1d9;

  --ok:   #157a45;  --ok-wash:   #dff3e7;
  --warn: #a85f0a;  --warn-wash: #fbefdb;
  --bad:  #c1121f;  --bad-wash:  #fce6e8;
  --info: #2a5a96;  --info-wash: #e5eef9;

  /* Triage — three levels by colour, the way the tent calls them out:
     T1 red, T2 bright orange, T3 green. This is the only ramp in the app and
     the one thing colour is spent on. a4/a5 remain defined so a record made
     on the five-level scale still renders while it is being folded into T3. */
  --a0: #93a0b8;  --a0-wash: #e9edf4;
  --a1: #c1121f;  --a1-wash: #fce6e8;
  --a2: #f97316;  --a2-wash: #ffedd5;
  --a3: #15803d;  --a3-wash: #e0f3e8;
  --a4: #15803d;  --a4-wash: #e0f3e8;
  --a5: #15803d;  --a5-wash: #e0f3e8;

  --ctl:     #141c2e;
  --ctl-ink: #ffffff;
  --focus:   #1c2e7a;

  --shadow-sm: 0 1px 2px rgba(15, 22, 35, .07);
  --shadow:    0 1px 2px rgba(15, 22, 35, .06), 0 10px 28px rgba(15, 22, 35, .10);
  --shadow-lg: 0 2px 6px rgba(15, 22, 35, .08), 0 24px 56px rgba(15, 22, 35, .18);

  --font-ui:      "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --radius: 9px;
  --radius-sm: 6px;
  --font-scale: 1;
  --tap: 44px;

  color-scheme: light;
}

/* ---- base --------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: calc(14px * var(--font-scale));
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}
:root[data-density="compact"] body { font-size: calc(13px * var(--font-scale)); }

button, input, select, textarea { font: inherit; color: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; }
a { color: var(--brand); }
:is(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
p { margin: 0 0 .7em; }
hr { border: 0; border-top: 1px solid var(--line-soft); margin: 12px 0; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .85em; }
.tiny  { font-size: .76em; }
.strong { font-weight: 700; }
.nowrap { white-space: nowrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.right { text-align: right; }
.center { text-align: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---- app frame ---------------------------------------------------------- */
#app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  position: relative;
  z-index: 5;
}
/* The logo sits on its own light plate so the navy wordmark reads on either
   theme without shipping a second asset. */
.brandmark {
  display: inline-flex; align-items: center; gap: 10px;
  min-width: 0; flex: 0 1 auto; overflow: hidden;
}
.brandmark .plate {
  display: block; background: #fff; border-radius: 6px;
  padding: 4px 7px; line-height: 0;
  box-shadow: inset 0 0 0 1px rgba(28, 46, 122, .10);
  flex: 0 0 auto;
}
.brandmark img { height: 22px; width: auto; display: block; }
.brandmark .title { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.brandmark .t1 {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1;
  color: var(--brand); white-space: nowrap;
}
.brandmark .t2 {
  font-family: var(--font-mono); font-size: 9px; font-weight: 600;
  letter-spacing: .19em; text-transform: uppercase; color: var(--ink-3);
  white-space: nowrap; margin-top: 1px;
}
/* The bar degrades in three steps rather than letting anything collide:
   lose the Event EMR line, then the nav labels, then the wordmark itself.
   The logo plate and the sync pill always survive — a field device must
   always show whose app this is and whether it is talking to the others. */
@media (max-width: 1040px) { .nav button { padding: 7px 9px; } }
@media (max-width: 900px)  { .nav .navlbl { display: none; } .nav button { padding: 7px 10px; } }
@media (max-width: 780px)  { .brandmark .t2 { display: none; } }
@media (max-width: 600px)  {
  .brandmark .title { display: none; }
  .topbar { padding: 6px 8px; gap: 7px; }
  .brandmark img { height: 20px; }
}

.topbar .spacer { flex: 1 1 auto; }

.nav { display: flex; gap: 3px; align-items: center; }
.nav button {
  padding: 7px 12px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 550; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap; min-height: 34px;
}
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.on { background: var(--ctl); color: var(--ctl-ink); }
.nav button .n {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  padding: 1px 5px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2);
}
.nav button.on .n { background: rgba(255,255,255,.22); color: inherit; }

.main { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 14px 14px 72px; }
@media (max-width: 600px) { .wrap { padding: 10px 9px 78px; } }
.wrap.narrow { max-width: 920px; }

/* ---- pills, chips, tags ------------------------------------------------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 550; letter-spacing: .01em;
  border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); flex: 0 0 auto; }
.pill.ok   { color: var(--ok);   background: var(--ok-wash);   border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-wash); border-color: transparent; }
.pill.bad  { color: var(--bad);  background: var(--bad-wash);  border-color: transparent; }
.pill.info { color: var(--info); background: var(--info-wash); border-color: transparent; }
.pill.brand{ color: var(--brand-ink); background: var(--brand-wash); border-color: transparent; }
.pill.ok .dot { background: var(--ok); }
.pill.warn .dot { background: var(--warn); }
.pill.bad .dot { background: var(--bad); }
.pill.info .dot { background: var(--info); }
.pill.live { animation: pulse 1.4s ease-in-out infinite; }

.tag {
  display: inline-block; padding: 2px 7px; border-radius: 5px;
  font-size: 11px; font-weight: 600; line-height: 1.4;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag.ok { background: var(--ok-wash); color: var(--ok); }
.tag.warn { background: var(--warn-wash); color: var(--warn); }
.tag.bad { background: var(--bad-wash); color: var(--bad); }
.tag.info { background: var(--info-wash); color: var(--info); }
.tag.brand { background: var(--brand-wash); color: var(--brand-ink); }
.tag.accent { background: var(--accent-wash); color: var(--accent-ink); }

/* Acuity badge — the single most-scanned object in the app. */
.acu {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 26px; height: 22px; padding: 0 6px; border-radius: 5px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: #fff; background: var(--a0); flex: 0 0 auto; letter-spacing: .02em;
}
.acu.a0 { background: var(--a0); } .acu.a1 { background: var(--a1); }
.acu.a2 { background: var(--a2); } .acu.a3 { background: var(--a3); }
.acu.a4 { background: var(--a4); } .acu.a5 { background: var(--a5); }

/* ---- buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; font-weight: 700; color: var(--ink);
  white-space: nowrap; line-height: 1.2; min-height: 36px;
  transition: border-color .12s, background .12s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.pri   { background: var(--ctl); color: var(--ctl-ink); border-color: var(--ctl); }
.btn.brand { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.ok    { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn.warn  { background: var(--warn); color: #fff; border-color: var(--warn); }
.btn.bad   { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.accent{ background: var(--accent); color: #3a2800; border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); border-color: transparent; color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 12px; min-height: 30px; border-radius: 5px; }
.btn.lg { padding: 13px 20px; font-size: 15px; min-height: var(--tap); border-radius: 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:active { transform: none; }
.btn svg { width: 16px; height: 16px; flex: 0 0 auto; }

.iconbtn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2); border: 1px solid transparent; flex: 0 0 auto;
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.on { background: var(--brand-wash); color: var(--brand-ink); }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.tight { gap: 5px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.tight { gap: 6px; }

/* segmented control — the fastest way to set acuity or a route one-handed */
.seg {
  display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm);
  overflow: hidden; background: var(--ground); flex-wrap: nowrap;
}
.seg button {
  padding: 7px 11px; font-size: 12.5px; font-weight: 550; color: var(--ink-3);
  white-space: nowrap; min-height: 34px; display: inline-flex;
  align-items: center; justify-content: center; gap: 5px;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ctl); color: var(--ctl-ink); }
.seg.block { display: flex; width: 100%; }
.seg.block button { flex: 1 1 0; }
.seg.acuity button { font-weight: 700; }
.seg.acuity button.on[data-a="1"] { background: var(--a1); border-color: var(--a1); color: #fff; }
.seg.acuity button.on[data-a="2"] { background: var(--a2); border-color: var(--a2); color: #fff; }
.seg.acuity button.on[data-a="3"] { background: var(--a3); border-color: var(--a3); color: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--surface);
  font-size: 12.5px; font-weight: 550; color: var(--ink); line-height: 1.2;
  min-height: 32px;
}
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--ctl); color: var(--ctl-ink); border-color: var(--ctl); }
.chip.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-wash); }
.chip.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-wash); }
.chip.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-wash); }
.chip .x { color: inherit; opacity: .55; font-size: 14px; line-height: 1; padding: 0 2px; }
.chip .x:hover { opacity: 1; }

/* ---- cards & sections --------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-h {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--line-soft);
}
.card-h h2, .card-h h3 { font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; }
.card-h .sub { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
.card-b { padding: 12px 13px; }
.card-b.flush { padding: 0; }
.card-f {
  display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  padding: 10px 13px; border-top: 1px solid var(--line-soft); background: var(--ground);
}

.sec-h {
  display: flex; align-items: baseline; gap: 10px;
  margin: 18px 0 9px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-3);
}
.sec-h:first-child { margin-top: 0; }
.sec-h .rule { flex: 1 1 auto; height: 1px; background: var(--line); }
.sec-h .act { font-weight: 550; letter-spacing: 0; text-transform: none; font-size: 12px; color: var(--brand); }

.empty {
  padding: 28px 18px; text-align: center; color: var(--ink-3);
  border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface);
}
.empty h3 { font-size: 14px; color: var(--ink-2); margin-bottom: 4px; }
.empty p { font-size: 12.5px; max-width: 46ch; margin: 0 auto .8em; }

/* ---- fields ------------------------------------------------------------- */
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > label {
  font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-3); line-height: 1.2;
  display: flex; align-items: center; gap: 5px;
}
.f input, .f select, .f textarea {
  padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--ground); width: 100%; min-height: var(--tap);
  font-size: 14px; color: var(--ink);
}
.f.sm input, .f.sm select, .f.sm textarea { min-height: 36px; padding: 7px 9px; font-size: 13px; }
.f input:focus, .f select:focus, .f textarea:focus {
  background: var(--surface); border-color: var(--brand); outline: none;
  box-shadow: 0 0 0 3px var(--brand-wash);
}
.f input::placeholder, .f textarea::placeholder { color: var(--ink-4); }
.f textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
.f.n input { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.f .hint { font-size: 11px; color: var(--ink-3); }
.f .err { font-size: 11px; color: var(--bad); font-weight: 550; }
.f.bad input, .f.bad select, .f.bad textarea { border-color: var(--bad); }

.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; }
.fgrid.tight { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.fgrid .w2 { grid-column: span 2; }
.fgrid .w3 { grid-column: span 3; }
.fgrid .wfull { grid-column: 1 / -1; }
@media (max-width: 560px) { .fgrid .w2, .fgrid .w3 { grid-column: 1 / -1; } }

/* The small module buttons that live inside a field. They are siblings of the
   input, absolutely placed, and deliberately mousedown-prevented in JS so the
   caret never leaves the field. */
.f .with-btn { position: relative; display: flex; align-items: center; }
.f .with-btn input { padding-right: 40px; }
.f .with-btn.two input { padding-right: 70px; }
.fx {
  position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  color: var(--brand-ink); background: var(--brand-wash);
  border: 1px solid var(--brand-line);
}
.fx:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
.fx.second { right: 39px; }
.fx.accent { color: var(--accent-ink); background: var(--accent-wash); border-color: var(--accent); }
.fx.danger { color: var(--bad); background: var(--bad-wash); border-color: var(--bad); }

/* ---- the live board ----------------------------------------------------- */
.strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 8px; margin-bottom: 14px;
}
.stat {
  padding: 10px 12px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1px; min-width: 0;
}
.stat label {
  font-size: 10px; font-weight: 650; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3);
}
.stat b {
  font-family: var(--font-mono); font-size: 25px; font-weight: 700;
  letter-spacing: -.025em; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.stat small { font-size: 11px; color: var(--ink-3); }
.stat.alert { border-color: var(--bad); background: var(--bad-wash); }
.stat.alert b, .stat.alert label { color: var(--bad); }
.stat .spark { height: 22px; margin-top: 2px; }
.stat .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* post columns */
.board {
  display: grid; gap: 11px;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  align-items: start;
}
.post {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
.post > .ph {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 11px; border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
.post > .ph .code {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 2px 6px; border-radius: 4px;
  background: var(--brand-wash); color: var(--brand-ink);
}
.post > .ph .nm { font-weight: 700; font-size: 13.5px; min-width: 0; letter-spacing: -.01em; }
.post > .ph .kind { font-size: 10.5px; color: var(--ink-3); }
.post.is-command { border-color: var(--brand-line); }
.post.is-command > .ph { background: var(--brand-wash); }

.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; padding: 9px 11px; }
.bed {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 8px; min-height: 58px; background: var(--ground);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  border-left: 4px solid var(--line);
}
.bed .lbl {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
  color: var(--ink-3); display: flex; align-items: center; gap: 5px;
}
.bed .who { font-size: 12.5px; font-weight: 600; }
.bed .meta { font-size: 10.5px; color: var(--ink-3); }
.bed.free { border-left-color: var(--ok); }
.bed.free .who { color: var(--ink-4); font-weight: 500; }
.bed.cleaning { border-left-color: var(--warn); background: var(--warn-wash); }
.bed.offline { border-left-color: var(--ink-4); opacity: .6; }
.bed.occupied { background: var(--surface); }
.bed.occupied.a1 { border-left-color: var(--a1); }
.bed.occupied.a2 { border-left-color: var(--a2); }
.bed.occupied.a3 { border-left-color: var(--a3); }
.bed.occupied.a4 { border-left-color: var(--a4); }
.bed.occupied.a5 { border-left-color: var(--a5); }
.bed.occupied.a0 { border-left-color: var(--a0); }
.bed.flag { box-shadow: inset 0 0 0 1px var(--bad); }
.bed:hover { border-color: var(--ink-3); }

/* waiting / unbedded queue inside a post */
.queue { border-top: 1px solid var(--line-soft); padding: 7px 11px 10px; }
.queue .qh {
  font-size: 10px; font-weight: 650; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px;
}

/* ---- patient rows ------------------------------------------------------- */
.plist { display: flex; flex-direction: column; gap: 5px; }
.prow {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 9px; align-items: center;
  padding: 8px 10px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--a0); min-height: var(--tap); width: 100%;
}
.prow:hover { border-color: var(--ink-3); }
.prow.a1 { border-left-color: var(--a1); }
.prow.a2 { border-left-color: var(--a2); }
.prow.a3 { border-left-color: var(--a3); }
.prow.a4 { border-left-color: var(--a4); }
.prow.a5 { border-left-color: var(--a5); }
.prow.closed { opacity: .62; }
.prow .nm { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; }
.prow .sub { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 7px; flex-wrap: wrap; }
.prow .sub .mrn { font-family: var(--font-mono); }
.prow .rt { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.prow .los {
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.prow.urgent { box-shadow: inset 0 0 0 1px var(--bad); }

.flagchips { display: flex; gap: 4px; flex-wrap: wrap; }
.flagchip {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  padding: 1px 5px; border-radius: 4px;
  background: var(--warn-wash); color: var(--warn); white-space: nowrap;
}
.flagchip.sev2 { background: var(--bad-wash); color: var(--bad); }

/* ---- patient chart ------------------------------------------------------ */
.chart { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .95fr); gap: 12px; align-items: start; }
@media (max-width: 1000px) { .chart { grid-template-columns: 1fr; } }

.pthead {
  position: sticky; top: 0; z-index: 4;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  padding: 10px 12px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-top: 4px solid var(--a0);
}
.pthead.a1 { border-top-color: var(--a1); }
.pthead.a2 { border-top-color: var(--a2); }
.pthead.a3 { border-top-color: var(--a3); }
.pthead.a4 { border-top-color: var(--a4); }
.pthead.a5 { border-top-color: var(--a5); }
.pthead h1 { font-size: 19px; line-height: 1.2; }
.pthead .mrn { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }

/* vitals table — the thing that gets read fastest, so it is mono and dense */
.vt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.vt th {
  text-align: right; font-size: 10px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 5px 7px; border-bottom: 1px solid var(--line); white-space: nowrap;
  position: sticky; top: 0; background: var(--surface);
}
.vt th:first-child, .vt td:first-child { text-align: left; }
.vt td {
  padding: 6px 7px; border-bottom: 1px dotted var(--line-soft);
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  text-align: right; white-space: nowrap;
}
.vt td.ab { color: var(--bad); font-weight: 600; }
.vt td.warn { color: var(--warn); font-weight: 600; }
.vt tr:hover td { background: var(--surface-2); }
.tblw { overflow-x: auto; }

/* timeline — orders, CPPT and code events share one visual language */
.tl { display: flex; flex-direction: column; }
.tl .e {
  display: grid; grid-template-columns: 50px 1fr auto; gap: 9px;
  padding: 7px 4px; border-bottom: 1px solid var(--line-soft);
  font-size: 12.5px; align-items: baseline;
}
.tl .e:last-child { border-bottom: 0; }
.tl .e .t { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.tl .e .l { min-width: 0; }
.tl .e .l b { font-weight: 650; }
.tl .e .l small { display: block; color: var(--ink-3); font-size: 11px; }
.tl .e .kind {
  width: 7px; height: 7px; border-radius: 50%; display: inline-block;
  margin-right: 6px; background: var(--ink-4); vertical-align: middle;
}
.tl .e.med   .kind { background: var(--info); }
.tl .e.fluid .kind { background: var(--brand); }
.tl .e.proc  .kind { background: var(--warn); }
.tl .e.note  .kind { background: var(--ink-4); }
.tl .e.shock .kind { background: var(--a2); }
.tl .e.rosc  .kind { background: var(--ok); }
.tl .e.cpr   .kind { background: var(--bad); }

/* CPPT entries read as notes, not as rows */
.note-card {
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 11px; background: var(--surface); display: grid; gap: 6px;
}
.note-card .nh {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-3);
}
.note-card .nh .who { font-weight: 650; color: var(--ink); font-size: 12.5px; }
.note-card .soap { display: grid; grid-template-columns: 18px 1fr; gap: 3px 8px; font-size: 13px; }
.note-card .soap .k {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  color: var(--brand); line-height: 1.55;
}
.note-card .soap .v { white-space: pre-wrap; word-break: break-word; }
.note-card.locked { background: var(--ground); }

/* ---- code board --------------------------------------------------------- */
.codebar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(116px, 1fr));
  gap: 7px; padding: 11px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
}
.codebar .k { display: flex; flex-direction: column; gap: 1px; padding: 7px 9px; border-radius: var(--radius-sm); background: var(--ground); }
.codebar .k label { font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.codebar .k b {
  font-family: var(--font-mono); font-size: 23px; font-weight: 600;
  letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums;
}
.codebar .k.main b { font-size: 31px; }
.codebar .k.cpr { background: var(--bad-wash); color: var(--bad); }
.codebar .k.cpr label { color: var(--bad); }
.codebar .k.due { background: var(--bad); color: #fff; animation: pulse 1s ease-in-out infinite; }
.codebar .k.due label { color: rgba(255,255,255,.88); }

/* ---- sheet (slide-over) ------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(10, 16, 28, .5);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fade .14s ease-out;
}
.scrim.on { display: flex; }

.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(820px, 100%);
  background: var(--surface); border-left: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column;
  animation: slide .18s cubic-bezier(.2, .7, .3, 1);
}
.sheet > .sh {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.sheet > .sh h2 { font-size: 15.5px; }
.sheet > .sb { flex: 1 1 auto; overflow: auto; padding: 13px; }
.sheet > .sf {
  display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  padding: 10px 12px; border-top: 1px solid var(--line); background: var(--ground); flex: 0 0 auto;
}
@media (max-width: 620px) {
  .sheet { width: 100%; top: auto; height: 94%; border-left: 0; border-top-left-radius: 14px; border-top-right-radius: 14px; }
}

.dialog {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-lg);
  width: min(460px, 100%); overflow: hidden;
  animation: pop .14s cubic-bezier(.2, .8, .3, 1);
}
.dialog-b { padding: 18px 18px 14px; font-size: 14px; line-height: 1.5; }
.dialog-f { display: flex; gap: 8px; justify-content: flex-end; padding: 11px 14px; border-top: 1px solid var(--line-soft); background: var(--ground); }

/* ---- toast -------------------------------------------------------------- */
.toast-host {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(14px);
  z-index: 60; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  max-width: calc(100% - 28px);
}
.toast-host.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast {
  background: var(--ctl); color: var(--ctl-ink);
  padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 550;
  box-shadow: var(--shadow-lg);
}
.toast.ok  { background: var(--ok); color: #fff; }
.toast.warn{ background: var(--warn); color: #fff; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---- sync indicator ----------------------------------------------------- */
.syncpill { cursor: pointer; }
.syncpill.offline { color: var(--warn); background: var(--warn-wash); border-color: transparent; }
.syncpill.error { color: var(--bad); background: var(--bad-wash); border-color: transparent; }
.syncpill.busy .dot { animation: pulse .9s ease-in-out infinite; }

/* ---- charts ------------------------------------------------------------- */
.chartbox { width: 100%; overflow: hidden; }
.chartbox svg { width: 100%; height: auto; display: block; }
.chartbox svg text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-3); }
.chartbox svg .axis { stroke: var(--line); }
.chartbox svg .grid { stroke: var(--line-soft); }
.chartbox svg .lbl { fill: var(--ink-2); font-weight: 600; }

/* ---- fab ---------------------------------------------------------------- */
.fab {
  position: fixed; right: 18px; bottom: 18px; z-index: 30;
  height: 52px; padding: 0 20px; border-radius: 26px;
  background: var(--bad); color: #fff; border: 0;
  font-size: 15px; font-weight: 700; letter-spacing: -.01em;
  display: inline-flex; align-items: center; gap: 9px;
  box-shadow: var(--shadow-lg);
}
.fab:active { transform: translateY(1px); }
.fab svg { width: 20px; height: 20px; }
@media (max-width: 560px) { .fab { right: 12px; bottom: 12px; } }

/* ---- tables (settings, formulary) --------------------------------------- */
.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dt th {
  text-align: left; font-size: 10px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap;
  background: var(--surface); position: sticky; top: 0; z-index: 1;
}
.dt td { padding: 7px 9px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.dt td.n { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.dt tr:hover td { background: var(--surface-2); }
.dt tr.off td { opacity: .5; }

/* ---- animation ---------------------------------------------------------- */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { transform: translateX(18px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes pop   { from { transform: scale(.97); opacity: .6; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

/* ---- print: the paper fallback when the printer is right there ---------- */
@media print {
  .topbar, .fab, .nav, .toast-host, .no-print { display: none !important; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .main { overflow: visible; }
  .wrap { max-width: none; padding: 0; }
  .card, .post, .prow { box-shadow: none; border-color: #999; break-inside: avoid; }
  .chart { grid-template-columns: 1fr; }
  a[href]::after { content: ""; }
}

/* ---- boot --------------------------------------------------------------- */
#boot {
  position: fixed; inset: 0; z-index: 90;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
  background: var(--ground);
}
#boot .plate { background: #fff; border-radius: 8px; padding: 10px 14px; line-height: 0; box-shadow: var(--shadow-sm); }
#boot img { height: 32px; width: auto; display: block; }
#boot .sub { font-size: 12.5px; color: var(--ink-3); text-align: center; max-width: 34ch; }
#boot .bar { width: 180px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 34%; border-radius: 2px; background: var(--brand); animation: bootslide 1.05s ease-in-out infinite; }
@keyframes bootslide { from { transform: translateX(-100%); } to { transform: translateX(330%); } }

/* ==========================================================================
   v2 — landing, binding, chat, triage board
   ========================================================================== */

/* ---- landing ------------------------------------------------------------ */
.landing { max-width: 760px; margin: 0 auto; padding-top: 10px; }
.landing-hero { text-align: center; padding: 18px 0 26px; }
.landing-hero .plate {
  display: inline-block; background: #fff; border-radius: 10px;
  padding: 12px 18px; line-height: 0; box-shadow: var(--shadow-sm);
}
.landing-hero img { height: 44px; width: auto; display: block; }
.landing-hero h1 {
  font-size: clamp(22px, 4.4vw, 31px); margin: 18px 0 6px;
  letter-spacing: -.035em; color: var(--brand);
}
.landing-hero p { color: var(--ink-3); max-width: 50ch; margin: 0 auto; font-size: 14px; }

.event-card { border-left: 4px solid var(--brand); }
.event-card h2 { letter-spacing: -.03em; }

/* ---- who this device is ------------------------------------------------- */
.whoami {
  display: flex; flex-direction: column; gap: 3px;
  padding: 8px 12px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  min-width: 190px; max-width: 320px;
}
.whoami.cc { border-color: var(--brand-line); background: var(--brand-wash); }
.whoami .code {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px; background: var(--brand); color: #fff;
}
.whoami .nm { font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; }
@media (max-width: 620px) { .whoami { max-width: none; width: 100%; } }

/* ---- banners ------------------------------------------------------------ */
.banner {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 14px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface);
  margin-bottom: 12px;
}
.banner svg { flex: 0 0 auto; }
.banner.ok   { border-color: var(--ok);   background: var(--ok-wash);   color: var(--ok); }
.banner.warn { border-color: var(--warn); background: var(--warn-wash); color: var(--warn); }
.banner.bad  { border-color: var(--bad);  background: var(--bad-wash);  color: var(--bad); }
.banner .small { color: var(--ink-2); font-weight: 500; }

/* ---- triage mix bar ----------------------------------------------------- */
.mixbar {
  display: flex; height: 26px; border-radius: 5px; overflow: hidden;
  gap: 1px; margin-top: 3px;
}
.mixbar > div {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #fff;
}
.mixbar .none {
  flex: 1; background: var(--surface-2); color: var(--ink-3); font-weight: 500;
}

/* ---- post card extras --------------------------------------------------- */
.post.is-mine { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand-line); }
.post.is-mine > .ph .nm::after {
  content: "YOU"; font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: .1em; color: var(--brand); margin-left: 7px; vertical-align: middle;
}
.post-f {
  display: flex; gap: 7px; justify-content: flex-end;
  padding: 8px 11px; border-top: 1px solid var(--line-soft); background: var(--ground);
}
.bedfull {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 11px; background: var(--bad-wash); color: var(--bad);
  font-size: 12.5px; font-weight: 700; border-bottom: 1px solid var(--line-soft);
}
.bed.overflow { border-style: dashed; background: var(--warn-wash); }
.bed.overflow .lbl { color: var(--warn); }

/* ---- read-only ---------------------------------------------------------- */
.readonly-note {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 12px; border-radius: var(--radius);
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); margin-bottom: 12px;
}
.locked-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  background: var(--ink); color: var(--ctl-ink);
}

/* ---- chat --------------------------------------------------------------- */
.chatdock {
  position: fixed; right: 18px; bottom: 18px; z-index: 35;
  display: flex; align-items: flex-end; gap: 10px;
  max-width: calc(100vw - 24px); pointer-events: none;
}
.chatdock > * { pointer-events: auto; }
/* The New-patient button owns the bottom-right corner, so the dock sits
   beside it and steps above it when the screen is too narrow for both. */
@media (min-width: 561px) { .chatdock { right: 190px; } }
@media (max-width: 560px) { .chatdock { right: 12px; bottom: 74px; } }

.chatlaunch {
  display: inline-flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 18px; border-radius: 26px;
  background: var(--ctl); color: var(--ctl-ink); border: 0;
  font-size: 14px; font-weight: 700; box-shadow: var(--shadow-lg);
  position: relative; flex: 0 0 auto;
}
.chatlaunch:active { transform: translateY(1px); }
.chatlaunch.has-unread { background: var(--bad); color: #fff; }
.chatlaunch .cnt {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
  background: rgba(255, 255, 255, .25); color: inherit;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
@media (max-width: 420px) { .chatlaunch .lbl { display: none; } .chatlaunch { padding: 0 16px; } }

.chatpanel {
  width: 310px; max-height: min(460px, 70vh);
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden;
}
@media (max-width: 720px) { .chatpanel { width: calc(100vw - 28px); } }
@media (max-width: 720px) { .chatdock { flex-direction: column; align-items: stretch; } }

.chatpanel .ch-h {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 10px; border-bottom: 1px solid var(--line);
  background: var(--brand); color: #fff; flex: 0 0 auto;
}
.chatpanel .ch-h .nm { font-weight: 700; font-size: 13px; }
.chatpanel .ch-h .sub { font-size: 10.5px; opacity: .85; white-space: nowrap; }
.chatpanel .ch-h .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .8; }
.chatpanel .ch-h .dot.amb { border-radius: 2px; }
.chatpanel .ch-h .iconbtn { color: #fff; width: 26px; height: 26px; }
.chatpanel .ch-h .iconbtn:hover { background: rgba(255, 255, 255, .18); color: #fff; }

.chatpanel .ch-log {
  flex: 1 1 auto; overflow-y: auto; padding: 10px;
  display: flex; flex-direction: column; gap: 7px; background: var(--ground);
}
.chatpanel .bubble {
  max-width: 85%; align-self: flex-start;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px 12px 12px 3px; padding: 7px 10px 4px;
  font-size: 13px; line-height: 1.4;
}
.chatpanel .bubble.mine {
  align-self: flex-end; background: var(--brand-wash);
  border-color: var(--brand-line); border-radius: 12px 12px 3px 12px;
}
.chatpanel .bubble.urgent { border-color: var(--bad); background: var(--bad-wash); }
.chatpanel .bubble .who {
  font-size: 10.5px; font-weight: 700; color: var(--brand-ink); margin-bottom: 1px;
}
.chatpanel .bubble .txt { word-break: break-word; white-space: pre-wrap; }
/* Timestamp at the bottom right of every bubble. */
.chatpanel .bubble .meta {
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
  margin-top: 2px;
}
.chatpanel .bubble .meta .at {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.chatpanel .bubble .meta .u {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: .08em; color: var(--bad);
}

.chatpanel .ch-quick {
  display: flex; gap: 5px; padding: 7px 8px 0; overflow-x: auto;
  scrollbar-width: none; flex: 0 0 auto;
}
.chatpanel .ch-quick::-webkit-scrollbar { display: none; }
.chatpanel .ch-quick .chip {
  white-space: nowrap; font-size: 11.5px; padding: 4px 9px; min-height: 28px;
}
.chatpanel .ch-f {
  display: flex; gap: 5px; align-items: center;
  padding: 8px; border-top: 1px solid var(--line-soft); flex: 0 0 auto;
}
.chatpanel .ch-f input {
  flex: 1 1 auto; min-width: 0; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 16px;
  background: var(--ground); font-size: 13px; min-height: 36px;
}
.chatpanel .ch-f input:focus { background: var(--surface); border-color: var(--brand); outline: none; }
.chatpanel .ch-f .iconbtn { width: 32px; height: 32px; }
.chatpanel .ch-f .iconbtn.on { background: var(--bad-wash); color: var(--bad); }

.iconbtn.sm { width: 28px; height: 28px; }
.chip.sm { padding: 4px 9px; font-size: 11.5px; min-height: 28px; }

@media print { .chatdock { display: none !important; } }
</style>
</head>
